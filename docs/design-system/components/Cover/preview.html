<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sohoj</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:var(--font-ui); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .lime { fill:var(--signal); }
  .amber { fill:var(--scan); }
  .tint { fill:var(--surface-raised); }
  .deep { fill:var(--ink); }
  .cut { fill:var(--on-signal); }
  .ring { fill:none; stroke:var(--signal); stroke-width:4; }
  .ringbody { fill:var(--bubble); }
  .lg { rx:var(--radius-lg); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:120px; line-height:.92; font-weight:800; letter-spacing:-.02em; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 6px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      signal 176x236 slab (the identity, largest) · surface-raised 112x180 bled off the top · scan as one 112x88 button pill (state colour, small) · ink 160x216 bled off the right edge — about 40% of 960x288
  arrangement one tall lime slab with satellites; bottoms on one line space-6 above the edge, space-4 gutters
  pattern     discs, from "big round shapes, the bubble": 12 dots cut into the slab in on-signal at a space-8 pitch, plus one bubble (size-bubble disc, signal ring) on the ink block
  scales      gutters space-4; pitch space-8; slab/tint/ink corners radius-lg; pill rx = half of size-button; bubble = size-bubble
-->
<rect class="lime lg" x="24" y="28" width="176" height="236" rx="28"/>
<rect class="tint lg" x="216" y="-20" width="112" height="180" rx="28"/>
<rect class="amber" x="216" y="176" width="112" height="88" rx="44"/>
<rect class="deep lg" x="344" y="48" width="160" height="216" rx="28"/>
<circle class="cut" cx="64" cy="68" r="6"/><circle class="cut" cx="96" cy="68" r="6"/><circle class="cut" cx="128" cy="68" r="6"/>
<circle class="cut" cx="64" cy="100" r="6"/><circle class="cut" cx="96" cy="100" r="6"/><circle class="cut" cx="128" cy="100" r="6"/>
<circle class="cut" cx="64" cy="132" r="6"/><circle class="cut" cx="96" cy="132" r="6"/><circle class="cut" cx="128" cy="132" r="6"/>
<circle class="cut" cx="64" cy="164" r="6"/><circle class="cut" cx="96" cy="164" r="6"/><circle class="cut" cx="128" cy="164" r="6"/>
<circle class="ringbody" cx="408" cy="200" r="32"/>
<circle class="ring" cx="408" cy="200" r="30"/>
</svg>
</div>
<div class="words">
<h1 class="name">Sohoj</h1>
<p class="tag">Big numbers, one tap, read aloud. Built for eyes that need it.</p>
</div>
</div>
</body>
</html>
